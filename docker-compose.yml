version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: electro_pi_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: electro_pi_db
    volumes:
      - mongo_data:/data/db

  # Node.js Express Backend Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: electro_pi_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/electro_pi_db
      JWT_SECRET: electro_pi_enterprise_secret_key_2026
      CLIENT_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - mongodb

  # React Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: electro_pi_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
